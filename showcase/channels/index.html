<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>True North — Travel Channel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<!-- Fonts for the showcase-picker dialog, matching the hub page -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'Gustavo';
    src:url('../assets/Gustavo-Bold.otf') format('opentype');
    font-weight:700;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --navy-950:#050b18;
    --navy-900:#0b1a30;
    --navy-800:#132844;
    --white:#ffffff;
    --gold:#d9480f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Georgia","Times New Roman",serif;
    color:var(--white);
  }
  a{color:inherit;text-decoration:none;}

  /* ---------- Header ---------- */
  header.site-header{
    background:var(--navy-950);
    color:var(--white);
    border-bottom:1px solid rgba(217,72,15,0.25);
  }
  .header-inner{
    max-width:1400px;
    margin:0 auto;
    padding:14px 24px;
    display:flex;
    align-items:center;
    gap:28px;
    flex-wrap:wrap;
  }
  .logo{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.5px;
    display:flex;
    align-items:center;
    gap:10px;
    white-space:nowrap;
  }
  .logo .compass svg{width:30px;height:30px;display:block;}
  nav.primary-nav{
    display:flex;
    gap:22px;
    flex:1;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    flex-wrap:wrap;
  }
  nav.primary-nav a{
    opacity:0.8;
    padding:6px 0;
    border-bottom:2px solid transparent;
    transition:opacity .15s, border-color .15s;
  }
  nav.primary-nav a:hover, nav.primary-nav a.active{
    opacity:1;
    border-bottom-color:var(--gold);
  }
  .header-tools{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:"Helvetica Neue",Arial,sans-serif;
  }
  button.switcher-trigger{
    display:inline-flex; align-items:center; gap:8px;
    background-color:var(--navy-800);
    color:var(--white);
    border:1px solid rgba(217,72,15,0.35);
    border-radius:6px;
    font-size:13px;
    font-family:"Helvetica Neue",Arial,sans-serif;
    cursor:pointer;
    max-width:220px;
    padding:7px 10px;
  }
  button.switcher-trigger:hover{border-color:var(--gold);}
  button.switcher-trigger .switcher-label{
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  button.switcher-trigger svg{ flex-shrink:0; width:10px; height:6px; }

  /* ---------- Showcase picker dialog ---------- */
  .picker-overlay{
    position:fixed; inset:0; z-index:1000;
    background:rgba(0,0,0,.6);
    display:none; align-items:center; justify-content:center;
    padding:20px;
  }
  .picker-overlay.open{ display:flex; }
  .picker-box{
    width:100%; max-width:520px; max-height:80vh;
    display:flex; flex-direction:column;
    overflow:hidden;
    background:var(--navy-900);
    border:1px solid rgba(217,72,15,0.35);
    border-radius:12px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.6);
  }
  .picker-head{
    flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:16px 20px;
    background:var(--navy-950);
    border-bottom:1px solid rgba(217,72,15,0.25);
  }
  .picker-head h2{
    margin:0;
    font-family:'Gustavo','Lato',-apple-system,BlinkMacSystemFont,sans-serif; font-weight:700;
    font-size:19px; color:var(--white);
  }
  .picker-close{
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    width:30px; height:30px;
    background:none; border:none; border-radius:8px;
    color:rgba(255,255,255,0.65); cursor:pointer;
  }
  .picker-close:hover, .picker-close:focus-visible{ background:rgba(255,255,255,0.08); color:var(--white); }
  .picker-close svg{ width:16px; height:16px; }
  .picker-list{
    flex:1 1 auto; min-height:0; overflow-y:auto;
    display:flex; flex-direction:column; gap:7px;
    padding:16px 20px;
  }
  .picker-item{
    display:block; width:100%; text-align:left;
    background:var(--navy-800);
    border:1px solid rgba(217,72,15,0.2);
    border-radius:8px;
    padding:11px 14px;
    cursor:pointer;
    font-family:'Lato',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    transition:border-color .15s ease, background .15s ease;
  }
  .picker-item:hover, .picker-item:focus-visible, .picker-item.is-active{
    border-color:var(--gold);
    background:rgba(217,72,15,0.12);
  }
  .picker-item-title{ font-size:14px; font-weight:700; color:var(--white); }
  .picker-item-desc{ display:block; margin-top:3px; font-size:13px; line-height:1.45; color:rgba(255,255,255,0.6); }
  button#clearHistoryBtn{
    background:var(--navy-800);
    color:var(--white);
    border:1px solid rgba(217,72,15,0.35);
    border-radius:6px;
    padding:7px 9px;
    font-size:14px;
    line-height:1;
    cursor:pointer;
  }
  button#clearHistoryBtn:hover{border-color:var(--gold);}

  /* ---------- Header: small screens ---------- */
  @media (max-width:700px){
    nav.primary-nav{display:none;}
    .logo .logo-text{display:none;}
    .header-inner{justify-content:space-between;}
  }

  /* ---------- Channels embed ---------- */
  main.channels-main{
    min-height:70vh;
    background:#000;
  }
  #channelsEmbed{
    width:100%;
  }

  /* ---------- Footer ---------- */
  footer.site-footer{
    background:var(--navy-950);
    color:rgba(255,255,255,0.55);
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:13px;
    text-align:center;
    padding:16px;
    border-top:1px solid rgba(217,72,15,0.25);
  }

  /* ---------- Login modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--navy-900);
    border:1px solid rgba(217,72,15,0.35);
    border-radius:12px;
    max-width:380px;
    width:100%;
    padding:32px 28px;
    text-align:center;
    font-family:"Helvetica Neue",Arial,sans-serif;
  }
  .modal-box .modal-icon{
    font-size:26px;
    color:var(--gold);
    margin-bottom:14px;
  }
  .modal-box h2{
    font-family:Georgia,"Times New Roman",serif;
    font-size:22px;
    margin:0 0 10px;
    color:var(--white);
  }
  .modal-box .modal-sub{
    font-size:13px;
    color:rgba(255,255,255,0.65);
    line-height:1.5;
    margin:0 0 22px;
  }
  .modal-box input{
    width:100%;
    padding:10px 12px;
    margin-bottom:10px;
    border-radius:6px;
    border:1px solid rgba(217,72,15,0.35);
    background:var(--navy-800);
    color:var(--white);
    font-size:14px;
    font-family:inherit;
  }
  .modal-box input::placeholder{color:rgba(255,255,255,0.4);}
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .modal-actions .btn{
    flex:1;
    padding:10px;
    border-radius:6px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .modal-actions .btn-primary{
    background:var(--gold);
    color:var(--navy-950);
    border:none;
  }
  .modal-actions .btn-ghost{
    background:transparent;
    color:var(--white);
    border:1px solid rgba(255,255,255,0.25);
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="../index.html"><span class="compass"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path opacity="1" fill="#ffffff" d="M288.4 96C288.4 78.3 302.7 64 320.4 64C338.1 64 352.4 78.3 352.4 96L352.4 128L288.4 128L288.4 96zM288.4 256L352.4 256L352.4 320L288.4 320L288.4 256zM288.4 448L352.4 448L352.4 544C352.4 561.7 338.1 576 320.4 576C302.7 576 288.4 561.7 288.4 544L288.4 448z"/><path fill="#d9480f" d="M128.4 128L505.8 128C510 128 514.1 129.7 517.1 132.7L565.1 180.7C571.3 186.9 571.3 197.1 565.1 203.3L517.1 251.3C514.1 254.3 510 256 505.8 256L128.4 256C110.7 256 96.4 241.7 96.4 224L96.4 160C96.4 142.3 110.7 128 128.4 128zM512.4 320C530.1 320 544.4 334.3 544.4 352L544.4 416C544.4 433.7 530.1 448 512.4 448L135 448C130.8 448 126.7 446.3 123.7 443.3L75.7 395.3C69.5 389.1 69.5 378.9 75.7 372.7L123.7 324.7C126.7 321.7 130.8 320 135 320L512.4 320z"/></svg></span> <span class="logo-text">True North</span></a>
    <nav class="primary-nav">
      <a href="#">Home</a>
      <a href="#" class="active">Watch</a>
      <a href="#">Destinations</a>
      <a href="#">Guides</a>
      <a href="#">About</a>
    </nav>
    <div class="header-tools">
      <button type="button" class="switcher-trigger" id="channelsSwitcherBtn" aria-haspopup="dialog">
        <span class="switcher-label" id="channelsSwitcherLabel">Loading&hellip;</span>
        <svg viewBox="0 0 10 6" aria-hidden="true"><path d="M0 0l5 6 5-6z" fill="currentColor"/></svg>
      </button>
      <button type="button" id="clearHistoryBtn" title="Clear watched history" aria-label="Clear watched history"><i class="fa-solid fa-clock-rotate-left"></i></button>
    </div>
  </div>
</header>

<main class="channels-main">
  <div id="channelsEmbed"></div>
</main>

<footer class="site-footer">
  &copy; 2026 True North. A demo publication for testing purposes only.
</footer>

<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <div class="modal-icon"><i class="fa-solid fa-lock"></i></div>
    <h2>Premium Content</h2>
    <p class="modal-sub">This video is available to premium members only. Log in to keep watching.</p>
    <input type="email" placeholder="Email address">
    <input type="password" placeholder="Password">
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost">Cancel</button>
      <button type="button" class="btn btn-primary" id="loginModalSubmit">Log In</button>
    </div>
  </div>
</div>

<div class="picker-overlay" id="switcherPicker">
  <div class="picker-box" role="dialog" aria-modal="true" aria-labelledby="switcherPickerTitle">
    <div class="picker-head">
      <h2 id="switcherPickerTitle">Choose a showcase</h2>
      <button type="button" class="picker-close" id="switcherPickerClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
    <div class="picker-list" id="switcherPickerList"></div>
  </div>
</div>

<script>
(function () {
  var PARAM = "embed";
  var switcherBtn = document.getElementById("channelsSwitcherBtn");
  var switcherLabel = document.getElementById("channelsSwitcherLabel");
  var embedContainer = document.getElementById("channelsEmbed");
  var clearHistoryBtn = document.getElementById("clearHistoryBtn");
  var loginModal = document.getElementById("loginModal");
  var loginModalSubmit = document.getElementById("loginModalSubmit");
  var picker = document.getElementById("switcherPicker");
  var pickerList = document.getElementById("switcherPickerList");
  var pickerClose = document.getElementById("switcherPickerClose");
  var options = [];
  var currentIndex = 0;

  // Fires whenever a viewer clicks a content-protected item, regardless of
  // which channel is loaded or why it's protected (geo, subscription, etc.).
  // We don't inspect e.detail.reason here — every case just shows this same
  // generic "premium content" prompt.
  window.addEventListener("contentblocked", function () {
    loginModal.classList.add("open");
  });

  loginModal.addEventListener("click", function (e) {
    if (e.target === loginModal) loginModal.classList.remove("open");
  });

  // Dummy login — just dismisses the dialog, no actual authentication.
  loginModalSubmit.addEventListener("click", function () {
    loginModal.classList.remove("open");
  });

  function loadEmbed(option) {
    embedContainer.innerHTML = "";
    var script = document.createElement("script");
    script.type = "text/javascript";
    script.async = true;
    script.src = option.url;
    embedContainer.appendChild(script);
  }

  function setUrlSlug(slug) {
    var url = new URL(window.location.href);
    url.searchParams.set(PARAM, slug);
    window.history.replaceState(null, "", url);
  }

  function selectOption(index) {
    currentIndex = index;
    var option = options[index];
    switcherLabel.textContent = option.title;
    setUrlSlug(option.slug);
    loadEmbed(option);
  }

  function renderPickerList() {
    pickerList.innerHTML = "";
    options.forEach(function (opt, i) {
      var item = document.createElement("button");
      item.type = "button";
      item.className = "picker-item" + (i === currentIndex ? " is-active" : "");

      var title = document.createElement("span");
      title.className = "picker-item-title";
      title.textContent = opt.title;
      item.appendChild(title);

      if (opt.description) {
        var desc = document.createElement("span");
        desc.className = "picker-item-desc";
        desc.textContent = opt.description;
        item.appendChild(desc);
      }

      item.addEventListener("click", function () {
        selectOption(i);
        closePicker();
      });
      pickerList.appendChild(item);
    });
  }

  function openPicker() {
    renderPickerList();
    picker.classList.add("open");
    pickerClose.focus();
  }

  function closePicker() {
    picker.classList.remove("open");
    switcherBtn.focus();
  }

  switcherBtn.addEventListener("click", openPicker);
  pickerClose.addEventListener("click", closePicker);
  picker.addEventListener("click", function (e) {
    if (e.target === picker) closePicker();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && picker.classList.contains("open")) closePicker();
  });

  clearHistoryBtn.addEventListener("click", function () {
    if (!confirm("Clear watched history for this demo?")) return;
    localStorage.removeItem("bb_play_history");
    for (var i = localStorage.length - 1; i >= 0; i--) {
      var key = localStorage.key(i);
      if (key && key.indexOf("bb-channel-watched-progress-") === 0) {
        localStorage.removeItem(key);
      }
    }
    loadEmbed(options[currentIndex]);
  });

  fetch("config.json", { cache: "no-store" })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      options = data;

      var requestedSlug = new URL(window.location.href).searchParams.get(PARAM);
      var index = 0;
      for (var i = 0; i < options.length; i++) {
        if (options[i].slug === requestedSlug) { index = i; break; }
      }

      selectOption(index);
    });
})();
</script>

</body>
</html>
