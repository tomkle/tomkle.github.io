<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>True North — Travel Channel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
  :root{
    --navy-950:#050b18;
    --navy-900:#0b1a30;
    --navy-800:#132844;
    --white:#ffffff;
    --gold:#c9a24b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Georgia","Times New Roman",serif;
    color:var(--white);
  }
  a{color:inherit;text-decoration:none;}

  /* ---------- Header ---------- */
  header.site-header{
    background:var(--navy-950);
    color:var(--white);
    border-bottom:1px solid rgba(201,162,75,0.25);
  }
  .header-inner{
    max-width:1400px;
    margin:0 auto;
    padding:14px 24px;
    display:flex;
    align-items:center;
    gap:28px;
    flex-wrap:wrap;
  }
  .logo{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.5px;
    display:flex;
    align-items:baseline;
    gap:10px;
    white-space:nowrap;
  }
  .logo .compass{color:var(--gold);font-size:22px;}
  nav.primary-nav{
    display:flex;
    gap:22px;
    flex:1;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    flex-wrap:wrap;
  }
  nav.primary-nav a{
    opacity:0.8;
    padding:6px 0;
    border-bottom:2px solid transparent;
    transition:opacity .15s, border-color .15s;
  }
  nav.primary-nav a:hover, nav.primary-nav a.active{
    opacity:1;
    border-bottom-color:var(--gold);
  }
  .header-tools{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:"Helvetica Neue",Arial,sans-serif;
  }
  .header-tools label{
    font-size:12px;
    opacity:0.7;
    margin-right:4px;
  }
  select#channelsSwitcher{
    background-color:var(--navy-800);
    color:var(--white);
    border:1px solid rgba(201,162,75,0.35);
    border-radius:6px;
    font-size:13px;
    font-family:"Helvetica Neue",Arial,sans-serif;
    cursor:pointer;
    max-width:220px;
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%23ffffff'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    background-size:10px 6px;
    padding:7px 28px 7px 10px;
  }
  select#channelsSwitcher:hover{border-color:var(--gold);}
  button#clearHistoryBtn{
    background:var(--navy-800);
    color:var(--white);
    border:1px solid rgba(201,162,75,0.35);
    border-radius:6px;
    padding:7px 9px;
    font-size:14px;
    line-height:1;
    cursor:pointer;
  }
  button#clearHistoryBtn:hover{border-color:var(--gold);}

  /* ---------- Channels embed ---------- */
  main.channels-main{
    min-height:70vh;
    background:#000;
  }
  #channelsEmbed{
    width:100%;
  }

  /* ---------- Footer ---------- */
  footer.site-footer{
    background:var(--navy-950);
    color:rgba(255,255,255,0.55);
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:13px;
    text-align:center;
    padding:16px;
    border-top:1px solid rgba(201,162,75,0.25);
  }

  /* ---------- Login modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--navy-900);
    border:1px solid rgba(201,162,75,0.35);
    border-radius:12px;
    max-width:380px;
    width:100%;
    padding:32px 28px;
    text-align:center;
    font-family:"Helvetica Neue",Arial,sans-serif;
  }
  .modal-box .modal-icon{
    font-size:26px;
    color:var(--gold);
    margin-bottom:14px;
  }
  .modal-box h2{
    font-family:Georgia,"Times New Roman",serif;
    font-size:22px;
    margin:0 0 10px;
    color:var(--white);
  }
  .modal-box .modal-sub{
    font-size:13px;
    color:rgba(255,255,255,0.65);
    line-height:1.5;
    margin:0 0 22px;
  }
  .modal-box input{
    width:100%;
    padding:10px 12px;
    margin-bottom:10px;
    border-radius:6px;
    border:1px solid rgba(201,162,75,0.35);
    background:var(--navy-800);
    color:var(--white);
    font-size:14px;
    font-family:inherit;
  }
  .modal-box input::placeholder{color:rgba(255,255,255,0.4);}
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .modal-actions .btn{
    flex:1;
    padding:10px;
    border-radius:6px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .modal-actions .btn-primary{
    background:var(--gold);
    color:var(--navy-950);
    border:none;
  }
  .modal-actions .btn-ghost{
    background:transparent;
    color:var(--white);
    border:1px solid rgba(255,255,255,0.25);
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo"><span class="compass">&#129517;</span> True North</div>
    <nav class="primary-nav">
      <a href="#">Home</a>
      <a href="#" class="active">Watch</a>
      <a href="#">Destinations</a>
      <a href="#">Guides</a>
      <a href="#">About</a>
    </nav>
    <div class="header-tools">
      <label for="channelsSwitcher">Channel:</label>
      <select id="channelsSwitcher" aria-label="Choose which Channels embed to display"></select>
      <button type="button" id="clearHistoryBtn" title="Clear watched history" aria-label="Clear watched history"><i class="fa-solid fa-clock-rotate-left"></i></button>
    </div>
  </div>
</header>

<main class="channels-main">
  <div id="channelsEmbed"></div>
</main>

<footer class="site-footer">
  &copy; 2026 True North. A demo publication for testing purposes only.
</footer>

<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <div class="modal-icon"><i class="fa-solid fa-lock"></i></div>
    <h2>Premium Content</h2>
    <p class="modal-sub">This video is available to premium members only. Log in to keep watching.</p>
    <input type="email" placeholder="Email address">
    <input type="password" placeholder="Password">
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost">Cancel</button>
      <button type="button" class="btn btn-primary" id="loginModalSubmit">Log In</button>
    </div>
  </div>
</div>

<script>
(function () {
  var PARAM = "embed";
  var selectEl = document.getElementById("channelsSwitcher");
  var embedContainer = document.getElementById("channelsEmbed");
  var clearHistoryBtn = document.getElementById("clearHistoryBtn");
  var loginModal = document.getElementById("loginModal");
  var loginModalSubmit = document.getElementById("loginModalSubmit");
  var options = [];

  // Fires whenever a viewer clicks a content-protected item, regardless of
  // which channel is loaded or why it's protected (geo, subscription, etc.).
  // We don't inspect e.detail.reason here — every case just shows this same
  // generic "premium content" prompt.
  window.addEventListener("contentblocked", function () {
    loginModal.classList.add("open");
  });

  loginModal.addEventListener("click", function (e) {
    if (e.target === loginModal) loginModal.classList.remove("open");
  });

  // Dummy login — just dismisses the dialog, no actual authentication.
  loginModalSubmit.addEventListener("click", function () {
    loginModal.classList.remove("open");
  });

  function loadEmbed(option) {
    embedContainer.innerHTML = "";
    var script = document.createElement("script");
    script.type = "text/javascript";
    script.async = true;
    script.src = option.url;
    embedContainer.appendChild(script);
  }

  function setUrlSlug(slug) {
    var url = new URL(window.location.href);
    url.searchParams.set(PARAM, slug);
    window.history.replaceState(null, "", url);
  }

  selectEl.addEventListener("change", function () {
    var option = options[parseInt(selectEl.value, 10)];
    setUrlSlug(option.slug);
    loadEmbed(option);
  });

  clearHistoryBtn.addEventListener("click", function () {
    if (!confirm("Clear watched history for this demo?")) return;
    localStorage.removeItem("bb_play_history");
    for (var i = localStorage.length - 1; i >= 0; i--) {
      var key = localStorage.key(i);
      if (key && key.indexOf("bb-channel-watched-progress-") === 0) {
        localStorage.removeItem(key);
      }
    }
    loadEmbed(options[parseInt(selectEl.value, 10)]);
  });

  fetch("config.json", { cache: "no-store" })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      options = data;
      options.forEach(function (opt, i) {
        var o = document.createElement("option");
        o.value = String(i);
        o.textContent = opt.label;
        selectEl.appendChild(o);
      });

      var requestedSlug = new URL(window.location.href).searchParams.get(PARAM);
      var index = 0;
      for (var i = 0; i < options.length; i++) {
        if (options[i].slug === requestedSlug) { index = i; break; }
      }

      selectEl.value = String(index);
      setUrlSlug(options[index].slug);
      loadEmbed(options[index]);
    });
})();
</script>

</body>
</html>
